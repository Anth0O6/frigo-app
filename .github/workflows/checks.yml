name: Vérifications

# Le workflow de publication ne tourne que sur `main`, et il signe puis publie
# une Release : hors de question de le déclencher pour éprouver une branche en
# cours. Celui-ci ne fait que ce qui doit passer avant une fusion — compiler et
# lancer les tests — et ne produit rien.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    name: Tests et compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # La sortie est capturée pour qu'un échec se résume aux lignes `e:` du
      # compilateur : la trace Gradle qui suit fait plusieurs centaines de
      # lignes et n'apprend rien sur une erreur de compilation.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/tests.log" || CODE=$?
          # Le nom du test, et la comparaison qui a échoué juste après : sans
          # elle, le résumé dit qu'un test est rouge sans dire pourquoi.
          grep -E '^e: |^[A-Za-z].*FAILED$|AssertionError|^\s+(expected|actual):' \
            "$RUNNER_TEMP/tests.log" | head -60 > "$RUNNER_TEMP/erreurs.txt" || true
          if [ -s "$RUNNER_TEMP/erreurs.txt" ]; then
            echo "::group::Erreurs"
            cat "$RUNNER_TEMP/erreurs.txt"
            echo "::endgroup::"
          fi
          exit "${CODE:-0}"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log" || CODE=$?
          grep -E '^e: ' "$RUNNER_TEMP/build.log" | head -60 > "$RUNNER_TEMP/erreurs.txt" || true
          if [ -s "$RUNNER_TEMP/erreurs.txt" ]; then
            echo "::group::Erreurs"
            cat "$RUNNER_TEMP/erreurs.txt"
            echo "::endgroup::"
          fi
          exit "${CODE:-0}"

      # Le schéma Room n'existe qu'après compilation. Le publier ici aussi rend
      # une migration vérifiable depuis une branche, sans attendre la fusion.
      - name: Publish Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      # Le schéma est produit à la compilation, et il est aussi committé : c'est
      # lui qui permettra d'écrire et d'éprouver la migration suivante. Les deux
      # doivent donc coïncider — un schéma committé à la main, ou oublié après un
      # changement d'entité, rendrait la prochaine migration invérifiable.
      - name: Vérifier que le schéma committé est à jour
        if: always()
        run: |
          if [ -z "$(git status --porcelain app/schemas/)" ]; then
            echo "Schéma committé conforme."
            exit 0
          fi
          echo "::error::Le schéma Room committé ne correspond pas à celui que la"
          echo "::error::compilation produit. Committez ce qui suit."

          # Un schéma *modifié* se lit en diff.
          git --no-pager diff -- app/schemas/

          # Un schéma *nouveau* n'apparaît dans aucun diff, et c'est pourtant le
          # cas le plus courant : une migration ajoute une version. Le fichier
          # fait une quarantaine de kilo-octets — il se récupère dans l'artefact
          # `room-schemas` — mais son empreinte d'identité est imprimée ici,
          # parce que c'est elle que `MigrationTest` doit connaître et la seule
          # valeur qui ne se déduise pas du schéma précédent.
          git ls-files --others --exclude-standard -- app/schemas/ | while read -r f; do
            echo "::error::Schéma absent du dépôt : $f"
            echo "    empreinte : $(grep -o '\"identityHash\": \"[a-f0-9]*\"' "$f" | head -1)"
          done
          exit 1

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Dernière étape du job, et c'est le but : le résumé doit être la
      # dernière chose imprimée pour rester lisible sans dérouler le journal.
      - name: Rappel des erreurs
        if: failure()
        run: |
          echo "=== Erreurs ==="
          cat "$RUNNER_TEMP/erreurs.txt" 2>/dev/null || echo "(aucune ligne e: capturée)"
