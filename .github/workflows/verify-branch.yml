# Workflow temporaire : vérifie que la branche de développement compile.
# À supprimer une fois la vérification faite.
name: Verify branch build

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build debug APK
        timeout-minutes: 20
        run: ./gradlew assembleDebug --stacktrace
      - name: Vérifie l'APK produit
        run: ls -l app/build/outputs/apk/debug/app-debug.apk
